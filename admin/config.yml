backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "news"
    label: "செய்திகள் / பதிவுகள்"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "தலைப்பு", name: "title", widget: "string"}
      - {label: "தேதி", name: "date", widget: "datetime"}
      - {label: "படம்", name: "image", widget: "image", required: false}
      - {label: "செய்தி விவரம்", name: "body", widget: "markdown"}
