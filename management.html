<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>நிர்வாகக் குழு - தமிழ்நாடு சமூக நல அமைப்புகள் மற்றும் தன்னார்வலர்கள் கூட்டமைப்பு</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .back-btn { display: inline-block; margin-bottom: 20px; padding: 10px 18px; background: #008cba; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .back-btn:hover { background: #006687; }
        h1 { color: #0056b3; text-align: center; border-bottom: 3px solid #0056b3; padding-bottom: 10px; margin-bottom: 25px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 14px 15px; text-align: left; border-bottom: 1px solid #e0e0e0; }
        th { background-color: #0056b3; color: white; font-size: 16px; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f5f9; }
        .role { font-weight: bold; color: #0056b3; width: 35%; }
        .name { font-size: 16px; font-weight: 600; color: #222; }
        
        /* இரு பெயர்களை பக்கவாட்டில் அமைப்பதற்கான குறியீடு */
        .flex-names { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .flex-names span { width: 48%; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn">← முகப்புப் பக்கத்திற்குச் செல்ல</a>
    
    <h1>நிர்வாகக் குழு (Management)</h1>

    <table>
        <thead>
            <tr>
                <th>பதவி / பொறுப்பு</th>
                <th>நிர்வாகி பெயர்</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="role">நிறுவனர் & மாநிலத் தலைவர்</td>
                <td class="name">Dr.K. முஹம்மது யஹ்யா</td>
            </tr>
            <tr>
                <td class="role">மாநிலத் துணைத் தலைவர்கள்</td>
                <td class="name">
                    <div class="flex-names">
                        <span>R. சாக்யா பிரபு</span>
                        <span>M.E. அமோஸ்</span>
                    </div>
                </td>
            </tr>
            <tr>
                <td class="role">பொதுச் செயலாளர்</td>
                <td class="name">Dr.N. கோபி B.Com., MA.,M.Phil.,MBA.,M.Phil.,P.hD.</td>
            </tr>
            <tr>
                <td class="role">பொருளாளர்</td>
                <td class="name">M. மஹாலக்ஷ்மி BSc.,</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
